<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>MedhaDarpan — Designing & Writing Code</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  html, body {
    margin: 0;
    min-height: 100%;
    background-color: #000000;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    color: #f5f5f7;
    overflow-x: hidden;
  }

  .canvas {
    width: 100%;
    min-height: 100svh;
    padding: max(26px, env(safe-area-inset-top)) 22px max(30px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
    background: #000000;
  }

  /* --- Interactive Apple Starfield Canvas --- */
  #apple-particle-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    opacity: 0.85;
  }

  /* --- Siri / Keynote Morphing Mesh Glow --- */
  .siri-mesh {
    position: absolute;
    top: 20%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: conic-gradient(
      from 180deg at 50% 50%,
      rgba(94, 92, 230, 0.38) 0deg,
      rgba(41, 151, 255, 0.32) 95deg,
      rgba(48, 209, 88, 0.22) 190deg,
      rgba(191, 90, 242, 0.30) 280deg,
      rgba(94, 92, 230, 0.38) 360deg
    );
    filter: blur(80px);
    animation: siriSpin 14s linear infinite alternate, siriMorph 7s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 1;
    will-change: transform, filter;
  }

  @keyframes siriSpin {
    0% { transform: translate(-50%, -50%) rotate(0deg) scale(0.9); }
    100% { transform: translate(-50%, -50%) rotate(360deg) scale(1.15); }
  }

  @keyframes siriMorph {
    0% { border-radius: 46% 54% 60% 40% / 45% 40% 60% 55%; filter: blur(75px); }
    50% { border-radius: 58% 42% 38% 62% / 60% 52% 48% 40%; filter: blur(90px); }
    100% { border-radius: 40% 60% 52% 48% / 48% 58% 42% 52%; filter: blur(75px); }
  }

  /* --- Navigation / Brand Bar --- */
  .nav-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    z-index: 2;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .app-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.03) 100%), #10121a;
    border: 0.5px solid rgba(255, 255, 255, 0.22);
    display: grid;
    place-items: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65), inset 0 1px 1px rgba(255, 255, 255, 0.35);
  }

  .app-icon::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 35% 25%, rgba(94, 92, 230, 0.5), transparent 65%);
  }

  .app-icon svg {
    position: relative;
    z-index: 1;
    width: 22px;
    height: 22px;
    filter: drop-shadow(0 2px 6px rgba(118, 217, 197, 0.4));
  }

  .brand-details {
    display: flex;
    flex-direction: column;
  }

  .brand-title {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.022em;
    color: #f5f5f7;
  }

  .brand-caption {
    font-size: 11px;
    font-weight: 400;
    color: #86868b;
    letter-spacing: -0.01em;
  }

  /* Live Pulsing Dynamic Island Badge */
  .dynamic-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 980px;
    background: rgba(18, 18, 20, 0.75);
    border: 0.5px solid rgba(255, 255, 255, 0.16);
    backdrop-filter: blur(20px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  }

  .beacon {
    position: relative;
    width: 8px;
    height: 8px;
  }

  .beacon-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #30d158;
    position: relative;
    z-index: 1;
  }

  .beacon-ripple {
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 1px solid #30d158;
    animation: ripplePulse 2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
  }

  @keyframes ripplePulse {
    0% { transform: scale(0.5); opacity: 1; }
    100% { transform: scale(2.4); opacity: 0; }
  }

  .beacon-label {
    font-size: 11px;
    font-weight: 600;
    color: #30d158;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  /* --- Minimal Center Stage --- */
  .center-stage {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    margin: auto 0;
    padding: 20px 0;
  }

  /* --- Apple-Grade Animated Hourglass / Sand Watch --- */
  .hourglass-chamber {
    position: relative;
    width: 90px;
    height: 90px;
    display: grid;
    place-items: center;
    border-radius: 28px;
    background: linear-gradient(180deg, rgba(30, 30, 36, 0.55) 0%, rgba(14, 14, 18, 0.8) 100%);
    border: 0.5px solid rgba(255, 255, 255, 0.16);
    backdrop-filter: blur(30px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    margin-bottom: 32px;
  }

  .hourglass-svg {
    width: 44px;
    height: 44px;
    animation: sandwatchTurn 4.6s cubic-bezier(0.77, 0, 0.175, 1) infinite;
    filter: drop-shadow(0 4px 12px rgba(118, 217, 197, 0.35));
  }

  @keyframes sandwatchTurn {
    0%, 40% { transform: rotate(0deg); }
    50%, 90% { transform: rotate(180deg); }
    100% { transform: rotate(360deg); }
  }

  /* Falling Sand Trickle */
  .sand-stream {
    stroke-dasharray: 4, 3;
    animation: sandFlow 0.8s linear infinite;
  }

  @keyframes sandFlow {
    from { stroke-dashoffset: 0; }
    to { stroke-dashoffset: 7; }
  }

  /* Headline & Microcopy */
  .pill-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 99px;
    background: rgba(41, 151, 255, 0.1);
    border: 0.5px solid rgba(41, 151, 255, 0.3);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #2997ff;
    margin-bottom: 14px;
  }

  h1 {
    margin: 0 0 12px;
    font-size: clamp(38px, 11vw, 56px);
    font-weight: 700;
    letter-spacing: -0.045em;
    line-height: 1.05;
  }

  .pro-gradient-text {
    background: linear-gradient(
      105deg,
      #ffffff 0%,
      #ffffff 35%,
      #8ef4db 50%,
      #ffffff 65%,
      #ffffff 100%
    );
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: textShine 7s infinite ease-in-out;
    display: inline-block;
  }

  @keyframes textShine {
    0% { background-position: 150% 0%; }
    50%, 100% { background-position: -50% 0%; }
  }

  .standfirst {
    margin: 0 auto;
    max-width: 300px;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.45;
    letter-spacing: -0.018em;
    color: #86868b;
  }

  /* Minimal Live Pulse Ellipsis */
  .ellipsis-flow {
    display: inline-flex;
    gap: 4px;
    margin-top: 18px;
  }

  .ellipsis-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #86868b;
    animation: dotPulse 1.4s ease-in-out infinite;
  }

  .ellipsis-dot:nth-child(2) { animation-delay: 0.2s; }
  .ellipsis-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dotPulse {
    0%, 100% { opacity: 0.25; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1.15); background: #f5f5f7; }
  }

  /* --- Minimal Footer --- */
  .footer-meta {
    position: relative;
    z-index: 2;
    text-align: center;
    padding-top: 20px;
  }

  .separator {
    height: 0.5px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.14), transparent);
    margin-bottom: 16px;
  }

  .meta-tagline {
    font-size: 12px;
    font-weight: 400;
    color: #636366;
    letter-spacing: -0.012em;
  }

  @media (min-width: 620px) {
    .canvas {
      max-width: 440px;
      margin: 28px auto;
      min-height: calc(100svh - 56px);
      border-radius: 36px;
      border: 0.5px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 35px 120px rgba(0, 0, 0, 0.95);
    }
  }
</style>
</head>
<body>

<main class="canvas">
  <canvas id="apple-particle-canvas"></canvas>
  <div class="siri-mesh"></div>

  <!-- Header -->
  <header class="nav-header">
    <div class="brand-group">
      <div class="app-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="medhaGrad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
              <stop stop-color="#FFFFFF"/>
              <stop offset="0.5" stop-color="#9BB7FF"/>
              <stop offset="1" stop-color="#49D4BC"/>
            </linearGradient>
          </defs>
          <path d="M12 2.5L20.5 7.5V16.5L12 21.5L3.5 16.5V7.5L12 2.5Z" stroke="url(#medhaGrad)" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M12 2.5V21.5" stroke="url(#medhaGrad)" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.6"/>
          <path d="M3.5 7.5L20.5 16.5" stroke="url(#medhaGrad)" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.4"/>
          <circle cx="12" cy="12" r="2.4" fill="url(#medhaGrad)"/>
        </svg>
      </div>
      <div class="brand-details">
        <span class="brand-title">MedhaDarpan</span>
        <span class="brand-caption">Adaptive Intelligence</span>
      </div>
    </div>
    <div class="dynamic-badge">
      <div class="beacon">
        <div class="beacon-dot"></div>
        <div class="beacon-ripple"></div>
      </div>
      <span class="beacon-label">In Progress</span>
    </div>
  </header>

  <!-- Minimal Center Focus -->
  <section class="center-stage">
    <!-- Animated Sand Watch -->
    <div class="hourglass-chamber">
      <svg class="hourglass-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sandGlow" x1="4" y1="2" x2="20" y2="22" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FFFFFF"/>
            <stop offset="0.5" stop-color="#BDB5FF"/>
            <stop offset="1" stop-color="#70E0CA"/>
          </linearGradient>
        </defs>
        <!-- Hourglass Frame -->
        <path d="M6 3H18M6 21H18" stroke="url(#sandGlow)" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M7 3C7 9 11.5 11 12 12C12.5 11 17 9 17 3" stroke="url(#sandGlow)" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M7 21C7 15 11.5 13 12 12C12.5 13 17 15 17 21" stroke="url(#sandGlow)" stroke-width="1.4" stroke-linecap="round"/>
        <!-- Trickling Center Stream -->
        <line x1="12" y1="11" x2="12" y2="18" stroke="url(#sandGlow)" stroke-width="1.3" class="sand-stream"/>
        <!-- Bottom Settling Sand -->
        <path d="M9 19.5C10.5 18.5 13.5 18.5 15 19.5" stroke="url(#sandGlow)" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="pill-badge">Crafting Platform</div>
    <h1><span class="pro-gradient-text">Designing &<br>writing code.</span></h1>
    <p class="standfirst">The mirror is coming together quietly late at night.</p>

    <div class="ellipsis-flow">
      <span class="ellipsis-dot"></span>
      <span class="ellipsis-dot"></span>
      <span class="ellipsis-dot"></span>
    </div>
  </section>

  <!-- Minimal Footer -->
  <footer class="footer-meta">
    <div class="separator"></div>
    <div class="meta-tagline">“A mirror for your professional knowledge.”</div>
  </footer>
</main>

<script>
  /* Apple Starfield Canvas */
  (function initParticleEngine() {
    const canvas = document.getElementById('apple-particle-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const STAR_COUNT = 90;
    for (let i = 0; i < STAR_COUNT; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 1.6 + 0.4,
        isSparkle: Math.random() > 0.70,
        baseAlpha: Math.random() * 0.5 + 0.25,
        alphaPhase: Math.random() * Math.PI * 2,
        pulseSpeed: Math.random() * 0.035 + 0.015,
        speedY: - (Math.random() * 0.35 + 0.1),
        speedX: (Math.random() - 0.5) * 0.18
      });
    }

    function drawSparkle(ctx, cx, cy, spikes, outerRadius, innerRadius, alpha) {
      let rot = Math.PI / 2 * 3;
      let step = Math.PI / spikes;
      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        ctx.lineTo(cx + Math.cos(rot) * outerRadius, cy + Math.sin(rot) * outerRadius);
        rot += step;
        ctx.lineTo(cx + Math.cos(rot) * innerRadius, cy + Math.sin(rot) * innerRadius);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.shadowColor = 'rgba(165, 180, 255, 0.9)';
      ctx.shadowBlur = 8;
      ctx.fill();
    }

    function renderParticles() {
      ctx.clearRect(0, 0, width, height);
      for (let p of particles) {
        p.y += p.speedY;
        p.x += p.speedX;
        p.alphaPhase += p.pulseSpeed;

        const currentAlpha = Math.max(0.12, Math.min(0.95, p.baseAlpha + Math.sin(p.alphaPhase) * 0.35));

        if (p.y < -12) { p.y = height + 10; p.x = Math.random() * width; }
        if (p.x < -10) p.x = width + 10;
        if (p.x > width + 10) p.x = -10;

        if (p.isSparkle) {
          const armLength = p.radius * 3.4;
          drawSparkle(ctx, p.x, p.y, 4, armLength, armLength * 0.22, currentAlpha);
        } else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${currentAlpha})`;
          ctx.shadowColor = 'rgba(145, 130, 255, 0.6)';
          ctx.shadowBlur = 4;
          ctx.fill();
        }
      }
      requestAnimationFrame(renderParticles);
    }
    requestAnimationFrame(renderParticles);
  })();
</script>
</body>
</html>
