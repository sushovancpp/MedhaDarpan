<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>MedhaDarpan — Designing & Writing Code</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  html, body {
    margin: 0;
    min-height: 100%;
    background-color: #000000;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    color: #f5f5f7;
    overflow-x: hidden;
  }

  .canvas {
    width: 100%;
    min-height: 100svh;
    padding: max(26px, env(safe-area-inset-top)) 22px max(30px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
    background: #000000;
  }

  /* Sparse Calm Starfield */
  #apple-particle-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    opacity: 0.55;
  }

  /* Subtle Small Gradient Aura */
  .siri-mesh {
    position: absolute;
    top: 24%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: conic-gradient(
      from 180deg at 50% 50%,
      rgba(94, 92, 230, 0.26) 0deg,
      rgba(41, 151, 255, 0.20) 95deg,
      rgba(48, 209, 88, 0.15) 190deg,
      rgba(191, 90, 242, 0.20) 280deg,
      rgba(94, 92, 230, 0.26) 360deg
    );
    filter: blur(55px);
    animation: siriSpin 14s linear infinite alternate, siriMorph 7s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 1;
    will-change: transform, filter;
  }

  @keyframes siriSpin {
    0% { transform: translate(-50%, -50%) rotate(0deg) scale(0.9); }
    100% { transform: translate(-50%, -50%) rotate(360deg) scale(1.1); }
  }

  @keyframes siriMorph {
    0% { border-radius: 46% 54% 60% 40% / 45% 40% 60% 55%; filter: blur(50px); }
    50% { border-radius: 58% 42% 38% 62% / 60% 52% 48% 40%; filter: blur(60px); }
    100% { border-radius: 40% 60% 52% 48% / 48% 58% 42% 52%; filter: blur(50px); }
  }

  /* Header */
  .nav-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    z-index: 2;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .app-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.03) 100%), #10121a;
    border: 0.5px solid rgba(255, 255, 255, 0.22);
    display: grid;
    place-items: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65), inset 0 1px 1px rgba(255, 255, 255, 0.35);
  }

  .app-icon::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 35% 25%, rgba(94, 92, 230, 0.4), transparent 65%);
  }

  .app-icon svg {
    position: relative;
    z-index: 1;
    width: 22px;
    height: 22px;
    filter: drop-shadow(0 2px 6px rgba(118, 217, 197, 0.4));
  }

  .brand-details {
    display: flex;
    flex-direction: column;
  }

  .brand-title {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.022em;
    color: #f5f5f7;
  }

  .brand-caption {
    font-size: 11px;
    font-weight: 400;
    color: #86868b;
    letter-spacing: -0.01em;
  }

  .dynamic-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 980px;
    background: rgba(18, 18, 20, 0.75);
    border: 0.5px solid rgba(255, 255, 255, 0.16);
    backdrop-filter: blur(20px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  }

  .beacon {
    position: relative;
    width: 8px;
    height: 8px;
  }

  .beacon-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #30d158;
    position: relative;
    z-index: 1;
  }

  .beacon-ripple {
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 1px solid #30d158;
    animation: ripplePulse 2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
  }

  @keyframes ripplePulse {
    0% { transform: scale(0.5); opacity: 1; }
    100% { transform: scale(2.4); opacity: 0; }
  }

  .beacon-label {
    font-size: 11px;
    font-weight: 600;
    color: #30d158;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  /* Center Stage */
  .center-stage {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    margin: auto 0;
    padding: 20px 0;
  }

  /* Hourglass Glass Pod */
  .hourglass-chamber {
    position: relative;
    width: 104px;
    height: 104px;
    display: grid;
    place-items: center;
    border-radius: 28px;
    background: linear-gradient(165deg, rgba(38, 42, 58, 0.6) 0%, rgba(14, 15, 22, 0.85) 100%);
    border: 0.5px solid rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(32px) saturate(180%);
    -webkit-backdrop-filter: blur(32px) saturate(180%);
    box-shadow:
      0 24px 60px rgba(0, 0, 0, 0.75),
      inset 0 1px 1px rgba(255, 255, 255, 0.3),
      inset 0 -1px 1px rgba(0, 0, 0, 0.5);
    margin-bottom: 30px;
    overflow: hidden;
  }

  .hourglass-chamber::after {
    content: '';
    position: absolute;
    top: 0;
    left: -60%;
    width: 50%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
    transform: skewX(-22deg);
    animation: podShine 5s infinite ease-in-out;
    pointer-events: none;
  }

  @keyframes podShine {
    0%, 70% { left: -60%; }
    100% { left: 160%; }
  }

  #hourglass-physics {
    width: 76px;
    height: 76px;
    display: block;
    cursor: default;
    filter: drop-shadow(0 4px 14px rgba(118, 217, 197, 0.35));
  }

  .pill-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 99px;
    background: rgba(41, 151, 255, 0.1);
    border: 0.5px solid rgba(41, 151, 255, 0.3);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #2997ff;
    margin-bottom: 14px;
  }

  h1 {
    margin: 0 0 12px;
    font-size: clamp(38px, 11vw, 56px);
    font-weight: 700;
    letter-spacing: -0.045em;
    line-height: 1.05;
  }

  .pro-gradient-text {
    background: linear-gradient(
      105deg,
      #ffffff 0%,
      #ffffff 35%,
      #8ef4db 50%,
      #ffffff 65%,
      #ffffff 100%
    );
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: textShine 7s infinite ease-in-out;
    display: inline-block;
  }

  @keyframes textShine {
    0% { background-position: 150% 0%; }
    50%, 100% { background-position: -50% 0%; }
  }

  .standfirst {
    margin: 0 auto;
    max-width: 300px;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.45;
    letter-spacing: -0.018em;
    color: #86868b;
  }

  .ellipsis-flow {
    display: inline-flex;
    gap: 4px;
    margin-top: 18px;
  }

  .ellipsis-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #86868b;
    animation: dotPulse 1.4s ease-in-out infinite;
  }

  .ellipsis-dot:nth-child(2) { animation-delay: 0.2s; }
  .ellipsis-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dotPulse {
    0%, 100% { opacity: 0.25; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1.15); background: #f5f5f7; }
  }

  /* Footer */
  .footer-meta {
    position: relative;
    z-index: 2;
    text-align: center;
    padding-top: 20px;
  }

  .separator {
    height: 0.5px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.14), transparent);
    margin-bottom: 16px;
  }

  .meta-tagline {
    font-size: 12px;
    font-weight: 400;
    color: #636366;
    letter-spacing: -0.012em;
  }

  @media (min-width: 620px) {
    .canvas {
      max-width: 440px;
      margin: 28px auto;
      min-height: calc(100svh - 56px);
      border-radius: 36px;
      border: 0.5px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 35px 120px rgba(0, 0, 0, 0.95);
    }
  }
</style>
</head>
<body>

<main class="canvas">
  <canvas id="apple-particle-canvas"></canvas>
  <div class="siri-mesh"></div>

  <header class="nav-header">
    <div class="brand-group">
      <div class="app-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="medhaGrad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
              <stop stop-color="#FFFFFF"/>
              <stop offset="0.5" stop-color="#9BB7FF"/>
              <stop offset="1" stop-color="#49D4BC"/>
            </linearGradient>
          </defs>
          <path d="M12 2.5L20.5 7.5V16.5L12 21.5L3.5 16.5V7.5L12 2.5Z" stroke="url(#medhaGrad)" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M12 2.5V21.5" stroke="url(#medhaGrad)" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.6"/>
          <path d="M3.5 7.5L20.5 16.5" stroke="url(#medhaGrad)" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.4"/>
          <circle cx="12" cy="12" r="2.4" fill="url(#medhaGrad)"/>
        </svg>
      </div>
      <div class="brand-details">
        <span class="brand-title">MedhaDarpan</span>
        <span class="brand-caption">Adaptive Intelligence</span>
      </div>
    </div>
    <div class="dynamic-badge">
      <div class="beacon">
        <div class="beacon-dot"></div>
        <div class="beacon-ripple"></div>
      </div>
      <span class="beacon-label">In Progress</span>
    </div>
  </header>

  <section class="center-stage">
    <div class="hourglass-chamber">
      <canvas id="hourglass-physics" width="152" height="152"></canvas>
    </div>

    <div class="pill-badge">Crafting Platform</div>
    <h1><span class="pro-gradient-text">Designing &<br>writing code.</span></h1>
    <p class="standfirst">The mirror is coming together quietly late at night.</p>

    <div class="ellipsis-flow">
      <span class="ellipsis-dot"></span>
      <span class="ellipsis-dot"></span>
      <span class="ellipsis-dot"></span>
    </div>
  </section>

  <footer class="footer-meta">
    <div class="separator"></div>
    <div class="meta-tagline">“A mirror for your professional knowledge.”</div>
  </footer>
</main>

<script>
  /* -------------------------------------------------------------
     1. Background Starfield
  ------------------------------------------------------------- */
  (function initParticleEngine() {
    const canvas = document.getElementById('apple-particle-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const STAR_COUNT = 24;
    for (let i = 0; i < STAR_COUNT; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 1.3 + 0.4,
        isSparkle: Math.random() > 0.82,
        baseAlpha: Math.random() * 0.4 + 0.15,
        alphaPhase: Math.random() * Math.PI * 2,
        pulseSpeed: Math.random() * 0.025 + 0.01,
        speedY: - (Math.random() * 0.22 + 0.06),
        speedX: (Math.random() - 0.5) * 0.1
      });
    }

    function drawSparkle(ctx, cx, cy, spikes, outerRadius, innerRadius, alpha) {
      let rot = Math.PI / 2 * 3;
      let step = Math.PI / spikes;
      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        ctx.lineTo(cx + Math.cos(rot) * outerRadius, cy + Math.sin(rot) * outerRadius);
        rot += step;
        ctx.lineTo(cx + Math.cos(rot) * innerRadius, cy + Math.sin(rot) * innerRadius);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.shadowColor = 'rgba(165, 180, 255, 0.7)';
      ctx.shadowBlur = 5;
      ctx.fill();
    }

    function renderParticles() {
      ctx.clearRect(0, 0, width, height);
      for (let p of particles) {
        p.y += p.speedY;
        p.x += p.speedX;
        p.alphaPhase += p.pulseSpeed;

        const currentAlpha = Math.max(0.08, Math.min(0.7, p.baseAlpha + Math.sin(p.alphaPhase) * 0.25));

        if (p.y < -12) { p.y = height + 10; p.x = Math.random() * width; }
        if (p.x < -10) p.x = width + 10;
        if (p.x > width + 10) p.x = -10;

        if (p.isSparkle) {
          const armLength = p.radius * 2.8;
          drawSparkle(ctx, p.x, p.y, 4, armLength, armLength * 0.22, currentAlpha);
        } else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${currentAlpha})`;
          ctx.shadowColor = 'rgba(145, 130, 255, 0.4)';
          ctx.shadowBlur = 3;
          ctx.fill();
        }
      }
      requestAnimationFrame(renderParticles);
    }
    requestAnimationFrame(renderParticles);
  })();

  /* -------------------------------------------------------------
     2. Physically-Accurate Hourglass Simulation
        - True world-down gravity (+Y)
        - Rotating bulbs: Bulb A & Bulb B swap roles every 180°
        - Stream only flows downward through neck when upper bulb has sand
        - Zero backward gravity / upward motion
  ------------------------------------------------------------- */
  (function initHourglassSimulation() {
    const canvas = document.getElementById('hourglass-physics');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;
    const CX = W / 2;
    const CY = H / 2;

    const DRAIN_TIME = 4200; // ms of steady flow
    const FLIP_TIME = 900;   // ms rotation
    const CYCLE_TIME = DRAIN_TIME + FLIP_TIME;

    const startTime = performance.now();

    // Stream grains that only move down (+Y)
    const grains = [];
    for (let i = 0; i < 18; i++) {
      grains.push({
        y: Math.random() * 26,
        xOff: (Math.random() - 0.5) * 1.8,
        speed: 1.4 + Math.random() * 1.8,
        size: 0.8 + Math.random() * 0.8,
        alpha: 0.4 + Math.random() * 0.6
      });
    }

    function easeInOutBack(x) {
      const c1 = 1.70158;
      const c2 = c1 * 1.525;
      return x < 0.5
        ? (Math.pow(2 * x, 2) * ((c2 + 1) * 2 * x - c2)) / 2
        : (Math.pow(2 * x - 2, 2) * ((c2 + 1) * (x * 2 - 2) + c2) + 2) / 2;
    }

    function render(time) {
      const elapsed = time - startTime;
      const cycleIndex = Math.floor(elapsed / CYCLE_TIME);
      const phaseTime = elapsed % CYCLE_TIME;
      const isFlipping = phaseTime >= DRAIN_TIME;

      // Calculate glass rotation angle
      let baseAngle = cycleIndex * Math.PI;
      let currentAngle = baseAngle;
      if (isFlipping) {
        const flipProgress = (phaseTime - DRAIN_TIME) / FLIP_TIME;
        currentAngle += easeInOutBack(flipProgress) * Math.PI;
      }

      // Sand drainage ratio: 0.0 (top full) -> 1.0 (bottom full)
      const drainRatio = isFlipping ? 1.0 : Math.min(1.0, phaseTime / (DRAIN_TIME - 300));

      // Determine which bulb is currently physically at the top
      // When cycleIndex is even: Bulb 1 is Top, Bulb 2 is Bottom
      // When cycleIndex is odd: Bulb 2 is Top, Bulb 1 is Bottom
      const bulb1Fraction = (cycleIndex % 2 === 0) ? (1 - drainRatio) : drainRatio;
      const bulb2Fraction = 1 - bulb1Fraction;

      ctx.clearRect(0, 0, W, H);

      // Shared Apple line gradient
      const grad = ctx.createLinearGradient(0, -42, 0, 42);
      grad.addColorStop(0, '#c7ceff');
      grad.addColorStop(0.5, '#9182ff');
      grad.addColorStop(1, '#49d4bc');

      /* ---- DRAW ROTATING GLASS & SAND INSIDE EACH BULB ---- */
      ctx.save();
      ctx.translate(CX, CY);
      ctx.rotate(currentAngle);

      function drawBulbSand(isTop, fraction) {
        if (fraction <= 0.01) return;
        ctx.save();
        ctx.beginPath();
        if (isTop) {
          // Top bulb clip region
          ctx.moveTo(-21, -38);
          ctx.lineTo(21, -38);
          ctx.lineTo(2.5, -4);
          ctx.lineTo(-2.5, -4);
        } else {
          // Bottom bulb clip region
          ctx.moveTo(-2.5, 4);
          ctx.lineTo(2.5, 4);
          ctx.lineTo(21, 38);
          ctx.lineTo(-21, 38);
        }
        ctx.closePath();
        ctx.clip();

        ctx.beginPath();
        if (isTop) {
          // Top sand surface lowers as it drains
          const sandTopY = -4 - (fraction * 34);
          ctx.moveTo(-22, sandTopY);
          ctx.quadraticCurveTo(0, sandTopY + 3, 22, sandTopY);
          ctx.lineTo(22, 0);
          ctx.lineTo(-22, 0);
        } else {
          // Bottom sand rises in a conical mound
          const moundHeight = fraction * 28;
          const moundPeakY = 38 - moundHeight;
          ctx.moveTo(-22, 40);
          ctx.lineTo(22, 40);
          ctx.lineTo(20, 38);
          ctx.quadraticCurveTo(0, moundPeakY, -20, 38);
        }
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.globalAlpha = 0.88;
        ctx.fill();
        ctx.restore();
      }

      // Draw sand in Bulb 1 (-Y side in local frame) and Bulb 2 (+Y side in local frame)
      drawBulbSand(true, bulb1Fraction);
      drawBulbSand(false, bulb2Fraction);

      /* ---- DRAW HOURGLASS FRAME CONTOUR ---- */
      ctx.globalAlpha = 1;
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2.8;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Top and bottom plates
      ctx.beginPath();
      ctx.moveTo(-24, -40);
      ctx.lineTo(24, -40);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-24, 40);
      ctx.lineTo(24, 40);
      ctx.stroke();

      // Hourglass glass walls
      ctx.beginPath();
      ctx.moveTo(-22, -39);
      ctx.bezierCurveTo(-21, -18, -4, -7, -2.6, 0);
      ctx.bezierCurveTo(-4, 7, -21, 18, -22, 39);

      ctx.moveTo(22, -39);
      ctx.bezierCurveTo(21, -18, 4, -7, 2.6, 0);
      ctx.bezierCurveTo(4, 7, 21, 18, 22, 39);
      ctx.stroke();

      // Subtle inner rim reflection
      ctx.beginPath();
      ctx.moveTo(-16, -34);
      ctx.quadraticCurveTo(-14, -20, -7, -10);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      ctx.restore();

      /* ---- DRAW DOWNWARD STREAM (WORLD SPACE ONLY) ---- */
      // The stream is anchored to the real floor. During flips or when empty, it stops.
      if (!isFlipping && drainRatio < 0.98) {
        ctx.save();
        ctx.translate(CX, CY);

        // Continuous falling trickle
        ctx.beginPath();
        ctx.moveTo(0, -3);
        ctx.lineTo(0, 20);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.6;
        ctx.lineCap = 'round';
        ctx.globalAlpha = 0.85;
        ctx.stroke();

        // Falling particles
        for (let g of grains) {
          g.y += g.speed;
          if (g.y > 22) {
            g.y = -3;
            g.xOff = (Math.random() - 0.5) * 1.6;
          }
          ctx.beginPath();
          ctx.arc(g.xOff, g.y, g.size * 0.7, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.globalAlpha = g.alpha;
          ctx.fill();
        }

        // Small impact ripple on bottom mound
        const moundPeak = 38 - (drainRatio * 28);
        ctx.beginPath();
        ctx.ellipse(0, moundPeak + 1, 3.5, 1.2, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.globalAlpha = 0.5;
        ctx.fill();

        ctx.restore();
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  })();
</script>
</body>
</html>
